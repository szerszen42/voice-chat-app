name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix and Install dependencies
        run: |
          sed -i 's/"@capacitor\/android": "\^8.5.2"/"@capacitor\/android": "^6.2.0"/' package.json || true
          sed -i 's/"@capacitor\/cli": "\^8.5.2"/"@capacitor\/cli": "^6.2.0"/' package.json || true
          sed -i 's/"@capacitor\/core": "\^8.5.2"/"@capacitor\/core": "^6.2.0"/' package.json || true
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 --save

      - name: Apply Mobile Responsive and Layout Fixes
        run: |
          # 1. Ukryj prawą listę członków na ekranach telefonów (żeby nie zajmowała połowy ekranu)
          sed -i 's/<div className="w-56 bg-dark-800/<div className="hidden md:flex w-56 bg-dark-800/' src/components/chat/ChatArea.jsx || true
          # 2. Zapobiegaj czarnemu ekranowi po rozłączeniu z kanału głosowego
          sed -i "s/activeView === 'server' && activeChannel?.type === 'voice'/activeView === 'server' \&\& activeChannel?.type === 'voice' \&\& activeVoiceChannel/" src/App.jsx || true

      - name: Build React Frontend
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.voicechat.app",
            "appName": "VoiceChat & Community",
            "webDir": "dist",
            "server": {
              "url": "https://voice-chat-app-8m36.onrender.com",
              "cleartext": true,
              "allowNavigation": ["https://voice-chat-app-8m36.onrender.com", "*.onrender.com"]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Inject Android FitsSystemWindows & Colors into Styles
        run: |
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:fitsSystemWindows">true</item>
                  <item name="android:statusBarColor">#1e1f22</item>
                  <item name="android:navigationBarColor">#1e1f22</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:background">#1e1f22</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          EOF

      - name: Inject Android Native Mic Permissions & System Bars Insets
        run: |
          mkdir -p android/app/src/main/java/com/voicechat/app
          cat << 'EOF' > android/app/src/main/java/com/voicechat/app/MainActivity.java
          package com.voicechat.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final int PERMISSION_REQUEST_CODE = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  if (window != null) {
                      WindowCompat.setDecorFitsSystemWindows(window, true);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS | WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION);
                          window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                          window.setStatusBarColor(Color.parseColor("#1e1f22"));
                          window.setNavigationBarColor(Color.parseColor("#1e1f22"));
                      }

                      View decorView = window.getDecorView();
                      if (decorView != null) {
                          ViewCompat.setOnApplyWindowInsetsListener(decorView, (v, insets) -> {
                              int topInset = insets.getInsets(WindowInsetsCompat.Type.statusBars()).top;
                              int bottomInset = insets.getInsets(WindowInsetsCompat.Type.navigationBars()).bottom;
                              v.setPadding(0, topInset, 0, bottomInset);
                              return WindowInsetsCompat.CONSUMED;
                          });
                      }
                  }

                  requestAppPermissions();

                  try {
                      WebView webView = this.getBridge().getWebView();
                      if (webView != null) {
                          webView.setWebChromeClient(new BridgeWebChromeClient(this.getBridge()) {
                              @Override
                              public void onPermissionRequest(final PermissionRequest request) {
                                  MainActivity.this.runOnUiThread(() -> {
                                      try {
                                          request.grant(request.getResources());
                                      } catch (Exception e) {
                                          e.printStackTrace();
                                      }
                                  });
                              }
                          });
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  requestAppPermissions();
              }

              private void requestAppPermissions() {
                  List<String> permissionsNeeded = new ArrayList<>();

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      permissionsNeeded.add(Manifest.permission.RECORD_AUDIO);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.MODIFY_AUDIO_SETTINGS) != PackageManager.PERMISSION_GRANTED) {
                      permissionsNeeded.add(Manifest.permission.MODIFY_AUDIO_SETTINGS);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.BLUETOOTH_CONNECT);
                      }
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_MEDIA_IMAGES);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_MEDIA_VIDEO);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          permissionsNeeded.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                  }

                  if (!permissionsNeeded.isEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toArray(new String[0]), PERMISSION_REQUEST_CODE);
                  }
              }
          }
          EOF

      - name: Inject Permissions into AndroidManifest
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />' android/app/src/main/AndroidManifest.xml || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload VoiceChat APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChat-Mobile
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
